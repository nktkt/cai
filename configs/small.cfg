# small.cfg - a single GB300 NVL72 rack (72 GPUs). Toy model for fast iteration.
# world_size = 72 ; replica = tp*pp*cp = 4*3*1 = 12 ; dp = 72/12 = 6

# model
hidden_size   = 4096
ffn_hidden    = 14336
num_layers    = 24
num_heads     = 32
num_kv_heads  = 8
head_dim      = 128
vocab_size    = 128000
seq_len       = 4096
is_moe        = 0

# precision / optimizer
param_dtype   = bf16
optim_dtype   = fp32
optim_states  = 2
master_weights = 1
recompute     = 1

# parallelism
tp            = 4
pp            = 3
ep            = 1
cp            = 1
microbatch    = 1
grad_accum    = 12

# topology (1 rack)
gpus_per_rack = 72
num_racks     = 1
spare_gpus    = 0
