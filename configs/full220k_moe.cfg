# full220k_moe.cfg - same 220,032-GPU cluster, a ~3.7T-param MoE (~180B active).
# replica = 8*16*1 = 128 ; dp = 1719 ; ep = 9 divides dp (1719 = 9 * 191).
# 72 experts over ep=9 -> 8 experts/rank; top_k=2 routed; all-to-all on the EP group.

hidden_size    = 16384
ffn_hidden     = 8192
num_layers     = 126
num_heads      = 128
num_kv_heads   = 16
head_dim       = 128
vocab_size     = 131072
seq_len        = 8192
is_moe         = 1
num_experts    = 72
moe_top_k      = 2

param_dtype    = bf16
optim_dtype    = fp32
optim_states   = 2
master_weights = 1
recompute      = 1

tp             = 8
pp             = 16
ep             = 9
cp             = 1
microbatch     = 1
grad_accum     = 128

gpus_per_rack  = 72
num_racks      = 3056
spare_gpus     = 0
intra_rack_bw  = 1800e9
inter_rack_bw  = 100e9
hbm_bw         = 8000e9
gpu_flops_bf16 = 2.5e15
gpu_mem_bytes  = 288e9
