# full220k.cfg - the target: 3056 GB300 NVL72 racks = 220,032 GPUs.
# replica = tp*pp*cp = 8*16*1 = 128 ; dp = 220032/128 = 1719 (exact).
# TP=8 stays intra-rack (9 TP groups per 72-GPU rack).

# model (~408B dense)
hidden_size    = 16384
ffn_hidden     = 53248
num_layers     = 126
num_heads      = 128
num_kv_heads   = 16
head_dim       = 128
vocab_size     = 131072
seq_len        = 8192
is_moe         = 0

# precision / optimizer
param_dtype    = bf16
optim_dtype    = fp32
optim_states   = 2
master_weights = 1
recompute      = 1

# parallelism
tp             = 8
pp             = 16
ep             = 1
cp             = 1
microbatch     = 1
grad_accum     = 128

# topology (3056 racks, exactly divisible)
gpus_per_rack  = 72
num_racks      = 3056
spare_gpus     = 0
intra_rack_bw  = 1800e9
inter_rack_bw  = 100e9
hbm_bw         = 8000e9
gpu_flops_bf16 = 2.5e15
gpu_mem_bytes  = 288e9
